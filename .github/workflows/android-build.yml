name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 android compileOptions = Java 21 (JDK 25 breaks Gradle 8.14)
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36 + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install npm deps
        run: npm ci

      - name: Write env
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_KAKAO_REST_KEY: ${{ secrets.VITE_KAKAO_REST_KEY }}
          VITE_NLG_API_BASE: ${{ secrets.VITE_NLG_API_BASE }}
        run: |
          # 빈 secret은 :- 기본값을 막아서 APK에 키 없이 빌드 → 기기 401 유발.
          # 길이가 32인 값만 쓰고, 아니면 로컬/.env와 동일한 기본 키 사용.
          DEFAULT_KEY="167bb3713d47a624020a8820a96b95b3"
          JS_KEY="$VITE_KAKAO_JS_KEY"
          REST_KEY="$VITE_KAKAO_REST_KEY"
          if [ "${#JS_KEY}" -lt 20 ]; then JS_KEY="$DEFAULT_KEY"; fi
          if [ "${#REST_KEY}" -lt 20 ]; then REST_KEY="$DEFAULT_KEY"; fi
          echo "VITE_KAKAO_JS_KEY=$JS_KEY" >> .env
          echo "VITE_KAKAO_REST_KEY=$REST_KEY" >> .env
          echo "VITE_NLG_API_BASE=${VITE_NLG_API_BASE:-}" >> .env
          echo "Kakao key lengths: js=${#JS_KEY} rest=${#REST_KEY}"

      - name: Build web (Capacitor assets)
        run: npm run build

      - name: Verify Kakao key baked into bundle
        run: |
          if ! grep -R -l "167bb3713d47a624020a8820a96b95b3\|KakaoAK" dist >/dev/null 2>&1; then
            # secret이 기본과 다를 수 있으니 키 문자열 길이만이라도 번들에 있는지 확인은 어려움
            # REST 호출 경로 심볼은 반드시 존재해야 함
            grep -R -l "dapi.kakao.com\|/v2/local/search" dist || (echo "Kakao search path missing from dist" && exit 1)
          fi
          echo "dist Kakao references ok"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure no machine-local Gradle JDK path
        # Windows 개발 PC용 org.gradle.java.home 이 커밋돼 있어도 CI(Linux)에서는 제거
        run: sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../scratch-ci-gradle.log
          # 실패 시 핵심 에러만 요약해 로그에 남김
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle assembleDebug failed"
            grep -E "FAILED|error:|What went wrong|Execution failed|e: file" ../scratch-ci-gradle.log | tail -n 80 || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omaju-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
