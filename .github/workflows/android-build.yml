name: Android Build & APK Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release / all)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        env:
          VITE_KAKAO_REST_KEY: ${{ secrets.VITE_KAKAO_REST_KEY || '167bb3713d47a624020a8820a96b95b3' }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY || '167bb3713d47a624020a8820a96b95b3' }}
        run: |
          DEFAULT_KEY="167bb3713d47a624020a8820a96b95b3"
          REST_KEY="${VITE_KAKAO_REST_KEY:-$DEFAULT_KEY}"
          JS_KEY="${VITE_KAKAO_JS_KEY:-$DEFAULT_KEY}"
          if [ "${#REST_KEY}" -lt 20 ]; then REST_KEY="$DEFAULT_KEY"; fi
          if [ "${#JS_KEY}" -lt 20 ]; then JS_KEY="$DEFAULT_KEY"; fi
          echo "VITE_KAKAO_REST_KEY=$REST_KEY" >> .env
          echo "VITE_KAKAO_JS_KEY=$JS_KEY" >> .env
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: omaju-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all') }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: omaju-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
