name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Setup Environment Variables
      run: |
        echo "VITE_KAKAO_JS_KEY=167bb3713d47a624020a8820a96b95b3" >> .env
        echo "VITE_KAKAO_REST_KEY=167bb3713d47a624020a8820a96b95b3" >> .env

    - name: Build Web App
      run: npm run build

    - name: Add Android
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: omaju-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
